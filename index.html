<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendAI — Reserva de Horário</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #ffffff; --pl: #94a3b8; --bg: #03030b;
            --bg-card: rgba(15, 15, 35, 0.4); --text: #f8fafc; --muted: #64748b;
            --acc: #8b5cf6; --acc2: #06b6d4; --success: #10b981;
            --gradient: linear-gradient(135deg, var(--acc) 0%, var(--acc2) 100%);
            --glass: blur(40px) saturate(200%);
            --r: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        /* Background Effects */
        .orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.2; pointer-events: none; z-index: -1; animation: orbit 15s ease-in-out infinite; }
        .orb-1 { width: 400px; height: 400px; background: var(--acc); top: -100px; left: -100px; }
        .orb-2 { width: 350px; height: 350px; background: var(--acc2); bottom: -50px; right: -50px; animation-delay: -3s; }
        @keyframes orbit { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px, 20px) scale(1.1); } }

        .container { 
            max-width: 480px; margin: 0 auto; padding: 40px 20px; 
            animation: fadeUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .salon-header { text-align: center; padding-bottom: 32px; }
        .salon-logo { 
            width: 80px; height: 80px; border-radius: 24px; background: var(--gradient);
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem; 
            margin: 0 auto 16px; box-shadow: 0 20px 40px rgba(139, 92, 246, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .salon-header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 4px; }
        .salon-header p { color: var(--pl); font-size: 0.95rem; font-weight: 500; }

        .step-indicator { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .step-dot { 
            height: 6px; width: 40px; border-radius: 10px; 
            background: rgba(255,255,255,0.05); transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .step-dot.active { background: var(--acc); width: 80px; box-shadow: 0 0 15px var(--acc); }
        .step-dot.done { background: var(--success); }

        .glass-panel {
            background: var(--bg-card); border-radius: var(--r); padding: 32px;
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: var(--glass);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeUp 0.5s ease; }

        .section-title { 
            font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; 
            color: var(--p); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px;
        }

        .service-card { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px; margin-bottom: 16px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .service-card:hover, .service-card.selected { 
            background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-4px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .service-info h3 { font-size: 1.05rem; font-weight: 600; color: var(--p); }
        .service-info p { font-size: 0.85rem; color: var(--pl); margin-top: 4px; font-weight: 500; }
        .service-price { font-weight: 800; color: var(--acc2); font-size: 1.2rem; }

        .pro-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .pro-card { 
            text-align: center; padding: 24px 16px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; cursor: pointer; transition: all 0.4s; 
        }
        .pro-card:hover, .pro-card.selected { 
            background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-4px); 
        }
        .pro-avatar { 
            width: 64px; height: 64px; border-radius: 20px; background: var(--gradient);
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; 
            margin: 0 auto 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .pro-card h3 { font-size: 0.95rem; font-weight: 600; }

        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .cal-nav { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: var(--p);
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .cal-nav:hover { background: rgba(255,255,255,0.08); border-color: var(--acc); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; font-weight: 700; text-transform: uppercase; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-cell { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s; 
            border: 1px solid transparent;
        }
        .day-cell:hover:not(.disabled) { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.2); }
        .day-cell.selected { background: var(--acc); color: white; font-weight: 800; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); }
        .day-cell.disabled { opacity: 0.15; cursor: default; }
        .day-cell.today { border-color: var(--acc2); color: var(--acc2); }

        .times-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .time-btn { 
            padding: 14px; text-align: center; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; cursor: pointer;
            transition: all 0.3s; font-size: 0.95rem; font-weight: 700; color: var(--pl); 
        }
        .time-btn:hover:not(.unavailable), .time-btn.selected { 
            border-color: var(--acc2); background: rgba(6, 182, 212, 0.1); color: var(--p); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .time-btn.unavailable { opacity: 0.15; cursor: default; text-decoration: line-through; }

        .summary-card { 
            background: rgba(255,255,255,0.02); border-radius: 20px; padding: 24px;
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 24px;
        }
        .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.95rem; }
        .summary-row:last-child { border: none; }
        .summary-label { color: var(--muted); font-weight: 500; }
        .summary-total { font-size: 1.4rem; font-weight: 900; color: var(--success); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--pl); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group input { 
            width: 100%; padding: 16px 20px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: var(--p);
            font-size: 1rem; font-family: inherit; outline: none; transition: all 0.3s; 
        }
        .input-group input:focus { border-color: var(--acc); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }

        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; 
            border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); margin-top: 24px; font-family: inherit; 
        }
        .btn-primary { 
            background: var(--gradient); color: white; 
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4); border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 25px 50px rgba(139, 92, 246, 0.6); }
        .btn-back { background: rgba(255,255,255,0.03); color: var(--pl); border: 1px solid rgba(255,255,255,0.05); margin-top: 12px; }

        .success-screen { text-align: center; padding: 40px 0; }
        .success-icon { 
            font-size: 4rem; width: 100px; height: 100px; background: rgba(16, 185, 129, 0.1); 
            border: 2px solid var(--success); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; margin: 0 auto 24px;
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--success);
        }
        .success-screen h2 { font-size: 2rem; font-weight: 800; color: var(--p); margin-bottom: 12px; }
        .success-screen p { color: var(--pl); font-size: 1rem; line-height: 1.6; }

        .powered-by { text-align: center; padding: 40px 20px; font-size: 0.8rem; color: var(--muted); opacity: 0.6; }
        .powered-by a { color: var(--acc2); text-decoration: none; font-weight: 700; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn { 0% { transform: scale(0); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .confetti { position: fixed; width: 8px; height: 8px; top: -10px; z-index: 1000; border-radius: 2px; animation: confettiFall 3s linear infinite; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="container">
        <div class="salon-header">
            <div class="salon-logo" id="salonLogo">✂️</div>
            <h1 id="salonName">Carregando...</h1>
            <p id="salonAddr"></p>
        </div>

        <div class="step-indicator">
            <div class="step-dot active" id="dot0"></div>
            <div class="step-dot" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
            <div class="step-dot" id="dot4"></div>
        </div>

        <div class="glass-panel">
            <!-- Step 0: Services -->
            <div class="step active" id="step0">
                <p class="section-title">Escolha o serviço</p>
                <div id="serviceList"></div>
            </div>

            <!-- Step 1: Professional -->
            <div class="step" id="step1">
                <p class="section-title">Escolha o profissional</p>
                <div class="pro-grid" id="proList"></div>
                <button class="btn btn-back" onclick="goStep(0)">← Voltar</button>
            </div>

            <!-- Step 2: Date & Time -->
            <div class="step" id="step2">
                <div class="cal-header">
                    <button class="cal-nav" onclick="changeMonth(-1)">←</button>
                    <h3 id="calMonthYear"></h3>
                    <button class="cal-nav" onclick="changeMonth(1)">→</button>
                </div>
                <div class="weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
                <div class="days-grid" id="daysGrid"></div>
                <div id="timesSection" style="display:none;">
                    <p class="section-title" style="margin-top:20px;">Horários disponíveis</p>
                    <div class="times-grid" id="timesGrid"></div>
                </div>
                <button class="btn btn-back" onclick="goStep(1)">← Voltar</button>
            </div>

            <!-- Step 3: Client Info -->
            <div class="step" id="step3">
                <p class="section-title">Seus dados</p>
                <div class="input-group">
                    <label>Nome completo</label>
                    <input type="text" id="clientName" placeholder="Ex: Maria Silva">
                </div>
                <div class="input-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="clientPhone" placeholder="(11) 99999-9999">
                </div>
                <div class="input-group">
                    <label>Email (opcional)</label>
                    <input type="email" id="clientEmail" placeholder="email@exemplo.com">
                </div>
                <div class="summary-card" style="margin-top:20px;">
                    <p class="section-title" style="margin-bottom:12px;">Resumo</p>
                    <div class="summary-row"><span class="summary-label">Serviço</span><span id="sumService"></span></div>
                    <div class="summary-row"><span class="summary-label">Profissional</span><span id="sumPro"></span></div>
                    <div class="summary-row"><span class="summary-label">Data</span><span id="sumDate"></span></div>
                    <div class="summary-row"><span class="summary-label">Horário</span><span id="sumTime"></span></div>
                    <div class="summary-row"><span class="summary-label">Valor</span><span class="summary-total" id="sumPrice"></span></div>
                </div>
                <button class="btn btn-primary" onclick="confirmBooking()">Finalizar Reserva</button>
                <button class="btn btn-back" onclick="goStep(2)">← Voltar</button>
            </div>

            <!-- Step 4: Success -->
            <div class="step" id="step4">
                <div class="success-screen">
                    <div class="success-icon">✓</div>
                    <h2>Reserva Confirmada!</h2>
                    <p>Seu horário foi agendado com sucesso. Você receberá um lembrete em breve.</p>
                    <div class="success-details" id="successDetails" style="display:none"></div>
                    <button class="btn btn-primary" onclick="window.location.reload()" style="margin-top:32px;">Fazer Novo Agendamento</button>
                </div>
            </div>
        </div>

        <div class="powered-by">Powered by <a href="#">AgendAI</a> Elite</div>
    </div>

    <script>
    // ===== Configuration (loaded from URL params or defaults) =====
    const params = new URLSearchParams(window.location.search);
    const SALON_ID = params.get('salon') || 'demo';

    const DEMO_CONFIG = {
        name: 'Studio Beleza Premium',
        address: 'Rua Exemplo, 123 — São Paulo',
        emoji: '✂️',
        services: [
            { id: 1, name: 'Corte Feminino', duration: 45, price: 80, emoji: '✂️' },
            { id: 2, name: 'Escova Progressiva', duration: 120, price: 180, emoji: '💇‍♀️' },
            { id: 3, name: 'Coloração', duration: 90, price: 150, emoji: '🎨' },
            { id: 4, name: 'Corte Masculino', duration: 30, price: 50, emoji: '💈' },
            { id: 5, name: 'Barba', duration: 20, price: 35, emoji: '🧔' },
            { id: 6, name: 'Manicure + Pedicure', duration: 60, price: 70, emoji: '💅' },
            { id: 7, name: 'Hidratação', duration: 45, price: 90, emoji: '💧' },
        ],
        professionals: [
            { id: 1, name: 'Ana Paula', emoji: '👩' },
            { id: 2, name: 'Carlos', emoji: '👨' },
            { id: 3, name: 'Juliana', emoji: '👩‍🦰' },
            { id: 4, name: 'Qualquer', emoji: '🔄' },
        ],
        hours: ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'],
        closedDays: [0], // Sunday
    };

    let config = DEMO_CONFIG;
    let selection = { service: null, professional: null, date: null, time: null };
    let currentMonth = new Date();

    // ===== Init =====
    // BUG#9 FIX + BUG-C1 FIX: aplica TODOS os campos da config salva pelo admin ao config vivo
    function init() {
        const saved = JSON.parse(localStorage.getItem(`agendai_${SALON_ID}_config`) || 'null');
        if (saved) {
            // Sobrescreve apenas os campos que existem na config salva
            if (saved.name)         config.name         = saved.name;
            if (saved.address)      config.address      = saved.address;
            if (saved.services    && Array.isArray(saved.services)    && saved.services.length)    config.services     = saved.services;
            if (saved.professionals && Array.isArray(saved.professionals) && saved.professionals.length) config.professionals = saved.professionals;
            if (saved.hours       && Array.isArray(saved.hours)       && saved.hours.length)       config.hours        = saved.hours;
            if (saved.closedDays  && Array.isArray(saved.closedDays))  config.closedDays   = saved.closedDays;
        }
        document.getElementById('salonName').textContent = config.name;
        document.getElementById('salonAddr').textContent = config.address;
        document.getElementById('salonLogo').textContent = config.emoji;
        renderServices();
    }

    function renderServices() {
        const container = document.getElementById('serviceList');
        container.innerHTML = config.services.map(s => `
            <div class="service-card" data-service-id="${s.id}" onclick="selectService(${s.id})">
                <div class="service-info">
                    <h3>${s.emoji} ${s.name}</h3>
                    <p>${s.duration} min</p>
                </div>
                <span class="service-price">R$ ${s.price}</span>
            </div>
        `).join('');
    }

    function selectService(id) {
        selection.service = config.services.find(s => s.id === id);
        // BUG#6 FIX: usa data-service-id para toggle sem depender de índice de array
        document.querySelectorAll('.service-card').forEach(c => {
            c.classList.toggle('selected', parseInt(c.dataset.serviceId) === id);
        });
        setTimeout(() => goStep(1), 200);
    }

    function renderProfessionals() {
        const container = document.getElementById('proList');
        container.innerHTML = config.professionals.map(p => `
            <div class="pro-card" data-pro-id="${p.id}" onclick="selectPro(${p.id})">
                <div class="pro-avatar">${p.emoji}</div>
                <h3>${p.name}</h3>
            </div>
        `).join('');
    }

    function selectPro(id) {
        selection.professional = config.professionals.find(p => p.id === id);
        // BUG#6 FIX: usa data-pro-id para toggle sem depender de índice de array
        document.querySelectorAll('.pro-card').forEach(c => {
            c.classList.toggle('selected', parseInt(c.dataset.proId) === id);
        });
        setTimeout(() => goStep(2), 200);
    }

    function renderCalendar() {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const today = new Date();
        today.setHours(0,0,0,0);

        document.getElementById('calMonthYear').textContent =
            new Date(year, month).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += '<div class="day-cell disabled"></div>';
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const isPast = date < today;
            const isClosed = config.closedDays.includes(date.getDay());
            const isToday = date.getTime() === today.getTime();
            const isSelected = selection.date && date.getTime() === selection.date.getTime();

            let cls = 'day-cell';
            if (isPast || isClosed) cls += ' disabled';
            if (isToday) cls += ' today';
            if (isSelected) cls += ' selected';

            grid.innerHTML += `<div class="${cls}" onclick="${isPast || isClosed ? '' : `selectDate(${year},${month},${d})`}">${d}</div>`;
        }
    }

    function selectDate(y, m, d) {
        selection.date = new Date(y, m, d);
        renderCalendar();
        renderTimes();
    }

    function renderTimes() {
        document.getElementById('timesSection').style.display = 'block';
        const grid = document.getElementById('timesGrid');
        const bookedSlots = getBookedSlots();
        grid.innerHTML = config.hours.map(h => {
            const booked = bookedSlots.includes(h);
            return `<div class="time-btn${booked ? ' unavailable' : ''}" onclick="${booked ? '' : `selectTime('${h}')`}">${h}</div>`;
        }).join('');
    }

    // BUG#4 FIX: lógica explícita para profissional 'Qualquer' (não depende de condição acidental)
    function getBookedSlots() {
        const bookings = JSON.parse(localStorage.getItem(`agendai_${SALON_ID}_bookings`) || '[]');
        if (!selection.date) return [];
        const dateStr = selection.date.toISOString().split('T')[0];
        const isAny = !selection.professional || selection.professional.name === 'Qualquer';
        return bookings
            .filter(b => b.date === dateStr && (isAny || b.proId === selection.professional.id))
            .map(b => b.time);
    }

    function selectTime(time) {
        selection.time = time;
        document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('selected', b.textContent === time));
        setTimeout(() => goStep(3), 200);
    }

    function goStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(`step${n}`).classList.add('active');

        for (let i = 0; i < 5; i++) {
            const dot = document.getElementById(`dot${i}`);
            if (dot) {
                dot.className = 'step-dot';
                if (i < n) dot.classList.add('done');
                if (i === n) dot.classList.add('active');
            }
        }

        if (n === 1) renderProfessionals();
        if (n === 2) renderCalendar();
        if (n === 3) updateSummary();
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateSummary() {
        document.getElementById('sumService').textContent = selection.service?.name || '';
        document.getElementById('sumPro').textContent = selection.professional?.name || '';
        document.getElementById('sumDate').textContent = selection.date?.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' }) || '';
        document.getElementById('sumTime').textContent = selection.time || '';
        document.getElementById('sumPrice').textContent = `R$ ${selection.service?.price || 0},00`;
    }

    function confirmBooking() {
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        if (!name || !phone) { alert('Por favor, preencha seu nome e WhatsApp.'); return; }

        const phoneClean = phone.replace(/\D/g, '');
        if (phoneClean.length < 10) {
            alert('WhatsApp inválido.');
            return;
        }

        const btn = document.querySelector('#step3 .btn-primary');
        if (btn) btn.disabled = true;

        const dateStr = selection.date.toISOString().split('T')[0];
        const existingBookings = JSON.parse(localStorage.getItem(`agendai_${SALON_ID}_bookings`) || '[]');
        
        const booking = {
            id: Date.now(),
            service: selection.service.name,
            serviceId: selection.service.id,
            price: selection.service.price,
            pro: selection.professional.name,
            proId: selection.professional.id,
            date: dateStr,
            time: selection.time,
            clientName: name,
            clientPhone: phone,
            clientEmail: document.getElementById('clientEmail').value.trim(),
            createdAt: new Date().toISOString(),
            status: 'confirmed'
        };

        existingBookings.push(booking);
        localStorage.setItem(`agendai_${SALON_ID}_bookings`, JSON.stringify(existingBookings));
        localStorage.setItem(`agendai_new_booking_trigger`, Date.now());

        goStep(4);
        spawnConfetti();
    }

    function createAccount() {
        const email = document.getElementById('clientEmail').value.trim();
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const pass = document.getElementById('regPassword').value.trim();

        if (!pass || pass.length < 4) {
            alert('Por favor, crie uma senha com pelo menos 4 caracteres.');
            return;
        }

        const users = JSON.parse(localStorage.getItem('agendai_users') || '{}');
        users[email] = { name, phone, pass, createdAt: new Date().toISOString() };
        localStorage.setItem('agendai_users', JSON.stringify(users));
        
        // Auto-login
        localStorage.setItem('agendai_client_email', email);
        localStorage.setItem('agendai_client_name', name);
        localStorage.setItem('agendai_client_since', users[email].createdAt);

        alert('Conta criada com sucesso!');
        location.href = 'index.html';
    }

    function spawnConfetti() {
        const colors = ['#8B5CF6', '#06B6D4', '#F472B6', '#10B981', '#FBBF24'];
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            c.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }
    }

    function changeMonth(dir) {
        currentMonth.setMonth(currentMonth.getMonth() + dir);
        renderCalendar();
    }

    init();
    </script>
</body>
</html>
